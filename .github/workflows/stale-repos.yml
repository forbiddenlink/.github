name: Stale Repos Report

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  stale-repos:
    name: Find stale repositories
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Find stale repos
        uses: github/stale-repos@cd662591ad9d5d8967f84431eb94a45f828c1db3 # v9
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORGANIZATION: forbiddenlink
          INACTIVE_DAYS: 90
          STALE_LABEL: stale
          EXEMPT_LABELS: active,pinned
          ADDITIONAL_METRICS: true