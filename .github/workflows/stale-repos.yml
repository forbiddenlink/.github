name: Stale Repos Report

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  stale-repos:
    name: Find stale repositories
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Find stale repos
        uses: github/stale-repos@c42a2821e3ef0cee1b1bc20b7eecbb2bfa7a83b4 # v9
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORGANIZATION: forbiddenlink
          INACTIVE_DAYS: 90
          STALE_LABEL: stale
          EXEMPT_LABELS: active,pinned
          ADDITIONAL_METRICS: true